# .github/workflows/metrics.yml
#
# Generates all profile stats as SVG files and commits them into this repo.
# No external image services involved — nothing here can go down.
#
# REQUIRES: a repository secret named METRICS_TOKEN (see setup notes).

name: Generate Metrics

on:
  schedule:
    - cron: "0 2 * * *"        # daily at 02:00 UTC
  workflow_dispatch:            # lets you run it manually
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ────────────────────────────────────────────────
      # 1. Core stats — replaces the old stats card
      # ────────────────────────────────────────────────
      - name: Core stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_theme: dark
          user: Mrigankar1134

      # ────────────────────────────────────────────────
      # 2. Languages — replaces the top-langs card
      # ────────────────────────────────────────────────
      - name: Languages
        uses: lowlighter/metrics@latest
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          user: Mrigankar1134
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # ────────────────────────────────────────────────
      # 3. Isometric calendar + habits
      #    Replaces the activity graph AND the streak card.
      #    The habits chart shows WHEN you commit — your 4 AM flex, proven.
      # ────────────────────────────────────────────────
      - name: Calendar and habits
        uses: lowlighter/metrics@latest
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          user: Mrigankar1134
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes

      # ────────────────────────────────────────────────
      # 4. Achievements — replaces the trophy case
      # ────────────────────────────────────────────────
      - name: Achievements
        uses: lowlighter/metrics@latest
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: dark
          user: Mrigankar1134
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
