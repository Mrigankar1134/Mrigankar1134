# .github/workflows/metrics.yml
#
# Generates all profile stats as SVG files and commits them into this repo.
# No external image services involved — nothing here can go down.
#
# REQUIRES: a repository secret named METRICS_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   Token scopes: public_repo (or repo for private stats) + read:user
#
# NOTE: debug/verify are ON for steps 3 and 4 to diagnose the two failing
# plugins. Remove those two lines from each once the errors are identified —
# they make the logs enormous.

name: Generate Metrics

on:
  schedule:
    - cron: "0 2 * * *"        # daily at 02:00 UTC
  workflow_dispatch:            # lets you run it manually
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ────────────────────────────────────────────────
      # 1. Core stats — replaces the old stats card
      # ────────────────────────────────────────────────
      - name: Core stats
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          user: Mrigankar1134
          # Dark styling — metrics has no config_theme input, extras_css is
          # the supported route. Repeat this block in each step you want dark.
          # extras_css: |
          #   :root {
          #     --color-calendar-graph-day-bg: #161b22;
          #     --color-text-default: #c9d1d9;
          #     --color-text-secondary: #8b949e;
          #   }
          #   svg { background: #0d1117 !important; }
          #   .row, .field, h2, .value { color: #c9d1d9 !important; }

      # ────────────────────────────────────────────────
      # 2. Languages — replaces the top-langs card
      # ────────────────────────────────────────────────
      - name: Languages
        uses: lowlighter/metrics@v3.34
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          user: Mrigankar1134
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # ────────────────────────────────────────────────
      # 3. Isometric calendar + habits
      #    Replaces the activity graph AND the streak card.
      #    habits is currently failing — debug is on to find out why.
      # ────────────────────────────────────────────────
      - name: Calendar and habits
        uses: lowlighter/metrics@v3.34
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          debug: yes
          verify: yes
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          user: Mrigankar1134
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes

      # ────────────────────────────────────────────────
      # 4. Achievements — replaces the trophy case
      #    Also failing — debug is on here too.
      # ────────────────────────────────────────────────
      - name: Achievements
        uses: lowlighter/metrics@v3.34
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          debug: yes
          verify: yes
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Kolkata
          user: Mrigankar1134
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
