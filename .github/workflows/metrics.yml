# .github/workflows/metrics.yml
#
# Generates profile stats as SVG files and commits them into this repo.
# No external image services involved — nothing here can go down.
#
# REQUIRES: a repository secret named METRICS_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   Classic token, scopes: repo (or public_repo) + read:user
#
# REMOVED: the habits plugin and the achievements step. Both fail on
# v3.34 with a generic "Unexpected error" that debug output didn't
# surface. If a future version fixes them, the old config is at the
# bottom of this file, commented out.

name: Generate Metrics

on:
  schedule:
    - cron: "0 2 * * *"        # daily at 02:00 UTC (07:30 IST)
  workflow_dispatch:            # lets you run it manually
  push:
    branches: ["main", "master"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ────────────────────────────────────────────────
      # 1. Core stats
      # ────────────────────────────────────────────────
      - name: Core stats
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stats.svg
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          user: Mrigankar1134

      # ────────────────────────────────────────────────
      # 2. Languages
      # ────────────────────────────────────────────────
      - name: Languages
        uses: lowlighter/metrics@v3.34
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          user: Mrigankar1134
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # ────────────────────────────────────────────────
      # 3. Isometric calendar
      #    Habits removed — isocalendar renders fine alone.
      # ────────────────────────────────────────────────
      - name: Calendar
        uses: lowlighter/metrics@v3.34
        if: ${{ success() || failure() }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/calendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          user: Mrigankar1134
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

# ──────────────────────────────────────────────────────
